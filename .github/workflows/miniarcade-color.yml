# Builds MiniArcade Color (the 320x240 colour console) for the ESP32-C3
# SuperMini, with the ILI9341 and with the ST7789 display (the ESP32-S3 still
# builds locally, but gets no release files). It has its own update channel,
# apart from the OLED console:
#   - every new MiniArcadeColor/version.txt on main becomes a release
#     "color-v<version>", marked as prerelease so it never turns into the
#     repository's "latest" release (that one belongs to the OLED console),
#   - the release "color-latest" always carries the newest files; the colour
#     boards look for updates there (releases/download/color-latest/).
# To be quick: the tests and both firmware builds run side by side, and a
# push to main whose build inputs were already built and tested on a branch
# (the squash merge of a pull request gives the same files) publishes that
# run's files instead of building them again. Only the build inputs are
# compared, so a bot commit elsewhere on main (e.g. ai-models.txt) does not
# spoil the match.
name: MiniArcade Color firmware

on:
  push:
    branches: ["**"]
    paths:
      - "MiniArcadeColor/**"
      - "MiniArcade/main/**"            # net, link, phone and fonts are shared
      - "MiniArcade/test/**"            # the colour scenarios use the shared test bench
      - "MiniArcadeServer/tests/golden.*"   # the TV decoder test reads the server's frames
      - ".github/workflows/miniarcade-color.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2 (empty = only build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # main only: a successful branch run of the very same tree, whose files can be published as they are
  reuse:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Look for a branch run with the same build inputs
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the paths that go into the firmware and the tests (see "paths" above)
          INPUTS="MiniArcadeColor MiniArcade/main MiniArcade/test MiniArcadeServer/tests .github/workflows/miniarcade-color.yml"
          R="repos/$GITHUB_REPOSITORY"
          here() { for p in $INPUTS; do git rev-parse "HEAD:$p"; done; }
          there() {
            for p in $INPUTS; do
              d="${p%/*}"; [ "$d" = "$p" ] && d=""
              gh api "$R/contents${d:+/$d}?ref=$1" --jq ".[] | select(.path == \"$p\") | .sha" </dev/null 2>/dev/null || echo "-"
            done
          }
          WANT="$(here)"
          gh api "$R/actions/workflows/miniarcade-color.yml/runs?status=success&per_page=30" \
            --jq '.workflow_runs[] | select(.head_branch != "main") | "\(.id) \(.head_sha)"' > runs.txt || true
          while read -r id sha; do
            [ "$(there "$sha")" = "$WANT" ] || continue
            n="$(gh api "$R/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "miniarcade-color-firmware" and .expired == false)] | length')"
            if [ "$n" = "1" ]; then echo "run_id=$id" >> "$GITHUB_OUTPUT"; echo "same build inputs as run $id: its files are used"; exit 0; fi
          done < runs.txt
          echo "no branch run with these build inputs: build here"

  host-tests:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the colour scenarios on the PC
        run: sh MiniArcadeColor/test/build.sh

  # both displays at the same time, beside the tests
  firmware:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run_id == '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ili9341
            dir: build-c3
            defaults: sdkconfig.defaults
            file: miniarcade-color-c3
          - name: st7789
            dir: build-c3st
            defaults: sdkconfig.defaults;sdkconfig.st7789
            file: miniarcade-color-c3-st7789
    steps:
      - uses: actions/checkout@v4
      - name: Update source and version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          echo "CONFIG_ARCADE_GITHUB_REPO=\"$GITHUB_REPOSITORY\"" >> MiniArcadeColor/sdkconfig.defaults
          if [ -n "$INPUT_VERSION" ]; then echo "${INPUT_VERSION#v}" > MiniArcadeColor/version.txt; fi   # a version by hand: the firmware says it too
      - name: Build for the ESP32-C3 (${{ matrix.name }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32c3
          path: MiniArcadeColor
          command: >-
            idf.py -B ${{ matrix.dir }} -DSDKCONFIG=${{ matrix.dir }}/sdkconfig -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build &&
            idf.py -B ${{ matrix.dir }} -DSDKCONFIG=${{ matrix.dir }}/sdkconfig -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" merge-bin -o full.bin
      - name: Collect the files
        run: |
          mkdir out
          cp MiniArcadeColor/${{ matrix.dir }}/miniarcade-color.bin out/${{ matrix.file }}.bin
          cp MiniArcadeColor/${{ matrix.dir }}/full.bin             out/${{ matrix.file }}-full.bin
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.name }}
          path: out/

  # the files of both builds in one artifact; on main with a new version.txt also the release
  publish:
    needs: [reuse, host-tests, firmware]
    if: ${{ !cancelled() && (needs.reuse.outputs.run_id != '' || (needs.host-tests.result == 'success' && needs.firmware.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            V="$(tr -d ' \r\n' < MiniArcadeColor/version.txt)"
            if gh release view "color-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release color-v$V exists already - raise MiniArcadeColor/version.txt for a new one"
            else
              VER="$V"
            fi
          fi
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::publish from main only (this run is on $GITHUB_REF_NAME)"; exit 1
            fi
            VER="${INPUT_VERSION#v}"
          fi
          if [ -n "$VER" ] && ! echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::version must look like 0.2, got '$VER'"; exit 1
          fi
          if [ -n "$VER" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi
          echo "version: ${VER:-$(cat MiniArcadeColor/version.txt)}"

      - name: The files of the branch run
        if: needs.reuse.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: miniarcade-color-firmware
          path: out
          run-id: ${{ needs.reuse.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: The files of this run
        if: needs.reuse.outputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: out
          merge-multiple: true

      - name: Version file
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          if [ -n "$V" ]; then echo "$V" > out/version.txt
          elif [ ! -f out/version.txt ]; then cp MiniArcadeColor/version.txt out/; fi
          ls -l out
          for f in miniarcade-color-c3.bin miniarcade-color-c3-full.bin miniarcade-color-c3-st7789.bin miniarcade-color-c3-st7789-full.bin version.txt; do
            [ -s "out/$f" ] || { echo "::error::$f is missing"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: miniarcade-color-firmware
          path: out/

      - name: Publish the release and the update channel
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          R="--repo $GITHUB_REPOSITORY"
          # the GitHub API now and then answers 500: try each step a few times
          retry() { for i in 1 2 3; do "$@" && return 0; echo "failed, try again in $((i * 20)) s"; sleep $((i * 20)); done; "$@"; }
          # the versioned release: a prerelease, never "latest"
          version_release() {
            gh release view "color-v$V" $R >/dev/null 2>&1 ||
              gh release create "color-v$V" $R --target "$GITHUB_SHA" --title "MiniArcade Color $V" \
                --prerelease --latest=false --generate-notes
          }
          retry version_release
          retry gh release upload "color-v$V" $R --clobber out/*
          # the channel the boards read: the firmware files first, version.txt
          # last, so no board sees a new number before its file is there
          channel() {
            gh release view color-latest $R >/dev/null 2>&1 ||
              gh release create color-latest $R --target "$GITHUB_SHA" --title "MiniArcade Color (update channel)" \
                --notes "Always the newest MiniArcade Color files. The colour consoles update from here." \
                --prerelease --latest=false
          }
          retry channel
          retry gh release upload color-latest $R --clobber out/miniarcade-color-c3.bin out/miniarcade-color-c3-full.bin \
            out/miniarcade-color-c3-st7789.bin out/miniarcade-color-c3-st7789-full.bin
          # the S3 files of earlier versions go: an S3 board would install them again and again
          for f in miniarcade-color-s3.bin miniarcade-color-s3-full.bin miniarcade-color-s3-st7789.bin miniarcade-color-s3-st7789-full.bin; do
            gh release delete-asset color-latest "$f" $R -y 2>/dev/null || true
          done
          retry gh release upload color-latest $R --clobber out/version.txt
