# Builds the MiniArcade firmware. A tag "v9.3" - or "Run workflow" with a
# version - also publishes a release; the boards fetch their updates from
# releases/latest/download/{version.txt,miniarcade.bin}.
name: MiniArcade firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["MiniArcade/**", ".github/workflows/miniarcade.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 9.3 (empty = only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the game scenarios on the PC
        run: sh MiniArcade/test/build.sh

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version and update source
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VER=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$INPUT_VERSION" ]; then VER="${INPUT_VERSION#v}"; fi
          if [ -n "$VER" ]; then
            echo "$VER" > MiniArcade/version.txt
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          fi
          # boards built here look for updates in this repository
          echo "CONFIG_ARCADE_GITHUB_REPO=\"$GITHUB_REPOSITORY\"" >> MiniArcade/sdkconfig.defaults
          echo "version: $(cat MiniArcade/version.txt)"

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32c3
          path: MiniArcade
          command: idf.py build && idf.py merge-bin -o miniarcade-full.bin

      - name: Collect the files
        run: |
          mkdir out
          cp MiniArcade/build/miniarcade.bin MiniArcade/build/miniarcade-full.bin MiniArcade/version.txt out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: miniarcade-firmware
          path: out/

      - name: Publish the release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: out/*
