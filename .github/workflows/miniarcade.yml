# Builds the MiniArcade firmware. A release "MiniArcade <version>" is
# published when
#   - main gets a MiniArcade/version.txt whose number has no release yet
#     (so: raise the number in the pull request, merge, done), or
#   - a tag "v9.3" is pushed, or "Run workflow" is started with a version.
# The boards fetch their updates from releases/latest/download/, and the
# files are also added to Versions/<version>/ on main for flashing by hand.
name: MiniArcade firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["MiniArcade/**", ".github/workflows/miniarcade.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 9.3 (empty = only build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the game scenarios on the PC
        run: sh MiniArcade/test/build.sh

  firmware:
    needs: host-tests                 # no release with failing tests
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # only this job publishes
    steps:
      - uses: actions/checkout@v4

      - name: Version and update source
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            V="$(tr -d ' \r\n' < MiniArcade/version.txt)"
            if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release v$V exists already - raise MiniArcade/version.txt for a new one"
            else
              VER="$V"                  # a new number on main: publish it
            fi
          fi
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::publish from main only (this run is on $GITHUB_REF_NAME)"; exit 1
            fi
            VER="${INPUT_VERSION#v}"
          fi
          if [ -n "$VER" ] && ! echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version must look like 9.3 or 9.3-rc1, got '$VER'"; exit 1
          fi
          if [ -n "$VER" ]; then
            echo "$VER" > MiniArcade/version.txt
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            # "9.3-rc1" is a test build: a prerelease, never offered to the boards
            case "$VER" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
          fi
          # boards built here look for updates in this repository
          echo "CONFIG_ARCADE_GITHUB_REPO=\"$GITHUB_REPOSITORY\"" >> MiniArcade/sdkconfig.defaults
          echo "version: $(cat MiniArcade/version.txt)"

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32c3
          path: MiniArcade
          command: idf.py build && idf.py merge-bin -o miniarcade-full.bin

      - name: Collect the files
        run: |
          mkdir out
          cp MiniArcade/build/miniarcade.bin MiniArcade/build/miniarcade-full.bin MiniArcade/version.txt out/
          # everything in one zip named after the version, with the German how-to
          V="${{ steps.ver.outputs.version }}"
          [ -n "$V" ] || V=$(tr -d ' \r\n' < MiniArcade/version.txt)
          cp Versions/ANLEITUNG.txt out/
          (cd out && zip -q -9 "MiniArcade-$V.zip" miniarcade-full.bin miniarcade.bin version.txt ANLEITUNG.txt && rm ANLEITUNG.txt)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: miniarcade-firmware
          path: out/

      # created as a draft first: the boards must never see a release whose
      # files are still being uploaded
      - name: Upload the release files
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MiniArcade ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          generate_release_notes: true
          files: out/*

      - name: Publish the release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRE: ${{ steps.ver.outputs.pre }}
        run: |
          if [ "$PRE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      # the same files also go into Versions/<version>/ on main, where they
      # are easy to find for flashing by hand (test builds like 9.6-rc1 not)
      - name: Add the version to Versions/ on main
        if: steps.ver.outputs.publish == 'true' && steps.ver.outputs.pre != 'true'
        continue-on-error: true           # a refused push must not spoil the release
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do            # main may move meanwhile: start over from it
            rm -rf /tmp/main; git worktree prune
            git fetch -q origin main
            git worktree add -q --detach /tmp/main FETCH_HEAD
            mkdir -p "/tmp/main/Versions/$V"
            cp out/miniarcade-full.bin out/miniarcade.bin "out/MiniArcade-$V.zip" "/tmp/main/Versions/$V/"
            git -C /tmp/main add "Versions/$V"
            if git -C /tmp/main diff --cached --quiet; then echo "Versions/$V is up to date"; exit 0; fi
            git -C /tmp/main commit -q -m "Versions: add MiniArcade $V"
            if git -C /tmp/main push -q origin HEAD:main; then echo "added Versions/$V"; exit 0; fi
            sleep 5
          done
          exit 1
