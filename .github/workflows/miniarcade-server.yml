# Tests of the MiniArcade server (YouTube TV for the colour console). No
# YouTube access in the tests: yt-dlp is replaced by a stand-in.
name: MiniArcade server

on:
  push:
    branches: ["**"]
    paths:
      - "MiniArcadeServer/**"
      - "MiniArcadeColor/main/gfx.*"
      - ".github/workflows/miniarcade-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server tests
        working-directory: MiniArcadeServer
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
